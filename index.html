<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点呼・打刻システム 🎀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Kiwi+Maru:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg-pink: #ffe6f2;
        --card-bg: rgba(255, 255, 255, 0.92);
        --text-main: #6b4b5e;
        --text-sub: #a37b93;
        --accent-pink: #ff80bf;
        --pink-shadow: #e65c9c;
        --mint-green: #70e4c8;
        --mint-shadow: #3bc4a3;
        --neon-pink: #ff4d94;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      body {
        font-family: 'Kiwi Maru', -apple-system, sans-serif;
        background: linear-gradient(135deg, #ffeef8 0%, #e8f4ff 50%, #fff0f5 100%);
        background-size: 200% 200%;
        animation: gradientBg 12s ease infinite;
        color: var(--text-main);
        margin: 0; padding: 16px;
        min-height: 100vh;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        overflow-x: hidden;
      }

      @keyframes gradientBg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .app-container {
        width: 100%; max-width: 390px;
        animation: floatCard 4s ease-in-out infinite alternate;
      }

      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      .header { text-align: center; margin-bottom: 20px; }
      .title {
        font-size: 1.1em; font-weight: 800; letter-spacing: 2px;
        color: #ff66a3; text-shadow: 2px 2px 0px #fff;
        margin: 0 0 6px 0; display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .clock {
        font-family: 'Fredoka', sans-serif;
        font-size: 2.6em; font-weight: 700; color: #ff529a;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0px #ffffff, 5px 5px 10px rgba(255, 133, 184, 0.3);
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 4px solid #ffffff;
        border-radius: 36px; padding: 28px 24px;
        box-shadow: 0 18px 35px rgba(230, 150, 190, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.8);
        position: relative;
      }

      .card::before {
        content: '🧸'; position: absolute; top: -18px; right: 20px;
        font-size: 1.8em; transform: rotate(12deg);
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      }

      .card.shake { animation: squishError 0.5s ease-in-out; }
      @keyframes squishError {
        0%, 100% { transform: scale(1, 1); }
        25% { transform: scale(1.15, 0.85); }
        50% { transform: scale(0.85, 1.15); }
        75% { transform: scale(1.05, 0.95); }
      }

      .form-group { margin-bottom: 22px; }
      label { display: block; font-size: 0.9em; font-weight: 800; color: var(--text-sub); margin-bottom: 10px; letter-spacing: 1px; text-align: center; }

      .select-wrapper { position: relative; }
      .select-wrapper::after {
        content: '🎀'; font-size: 1.1em;
        position: absolute; right: 18px; top: 50%; transform: translateY(-50%); pointer-events: none;
      }

      select {
        width: 100%; height: 60px; padding: 0 45px 0 20px;
        font-family: 'Kiwi Maru', sans-serif; font-size: 1.1em; font-weight: 800;
        color: var(--text-main); background-color: #fffafc;
        border: 3px solid #ffd1e8; border-radius: 24px;
        outline: none; appearance: none; -webkit-appearance: none;
        box-shadow: inset 0 4px 8px rgba(255, 182, 217, 0.15);
        transition: all 0.2s ease;
      }

      select:focus { border-color: #ff80bf; box-shadow: 0 0 12px rgba(255, 128, 191, 0.4); }

      .btn-group { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
      
      .btn {
        width: 100%; height: 66px; border: none; border-radius: 28px;
        font-family: 'Kiwi Maru', sans-serif; font-size: 1.25em; font-weight: 800;
        letter-spacing: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative; top: 0;
      }

      .btn-in {
        display: none; background: #60ebd1; color: #ffffff;
        text-shadow: 1px 2px 0px var(--mint-shadow);
        box-shadow: 0 8px 0px var(--mint-shadow), 0 15px 20px rgba(59, 196, 163, 0.35);
        border: 3px solid #ffffff;
      }
      .btn-in:active:not(:disabled) {
        top: 6px; box-shadow: 0 2px 0px var(--mint-shadow), 0 5px 10px rgba(59, 196, 163, 0.3);
      }

      .btn-out {
        display: none; background: #ff75b3; color: #ffffff;
        text-shadow: 1px 2px 0px var(--pink-shadow);
        box-shadow: 0 8px 0px var(--pink-shadow), 0 15px 20px rgba(230, 92, 156, 0.35);
        border: 3px solid #ffffff;
      }
      .btn-out:active:not(:disabled) {
        top: 6px; box-shadow: 0 2px 0px var(--pink-shadow), 0 5px 10px rgba(230, 92, 156, 0.3);
      }

      .btn:disabled { opacity: 0.5; filter: grayscale(0.5); cursor: not-allowed; }

      #result {
        margin-top: 22px; padding: 18px 20px; border-radius: 24px; display: none; font-size: 0.95em; line-height: 1.6;
        animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes popUp {
        from { opacity: 0; transform: scale(0.8) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      .result-success { background: #f0fff9; border: 3px solid #a3f3df; box-shadow: 0 8px 20px rgba(112, 228, 200, 0.25); color: #226b58; }
      .result-error { background: #fff0f5; border: 3px solid #ffb3d6; box-shadow: 0 8px 20px rgba(255, 128, 191, 0.25); color: #8a305b; }
      .result-title { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 1.1em; }
      .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 2px dashed rgba(163, 123, 147, 0.2); }
      .info-val { font-family: 'Fredoka', sans-serif; font-size: 1.3em; font-weight: 700; color: #ff529a; }

      /* ==========================================
         かわいいローディングオーバーレイ
         ========================================== */
      .loading-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 238, 248, 0.88);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999; opacity: 0; pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .loading-overlay.active { opacity: 1; pointer-events: auto; }

      .loading-box {
        text-align: center; background: #ffffff;
        padding: 24px 32px; border-radius: 32px;
        border: 4px solid #ffd1e8;
        box-shadow: 0 15px 30px rgba(255, 128, 191, 0.3);
        animation: loadingBounce 0.8s ease-in-out infinite alternate;
      }

      @keyframes loadingBounce {
        from { transform: translateY(0px) scale(0.98); }
        to { transform: translateY(-10px) scale(1.02); }
      }

      .loading-icon { font-size: 2.8em; margin-bottom: 8px; display: inline-block; animation: spinIcon 2s linear infinite; }
      @keyframes spinIcon {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text { font-size: 1.1em; font-weight: 800; color: #ff529a; margin-bottom: 12px; }

      .loading-dots { display: flex; justify-content: center; gap: 8px; }
      .loading-dots span {
        width: 12px; height: 12px; background-color: #ff80bf; border-radius: 50%;
        animation: dotBounce 0.6s infinite alternate;
      }
      .loading-dots span:nth-child(2) { animation-delay: 0.2s; background-color: #70e4c8; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; background-color: #ffb3d6; }

      @keyframes dotBounce {
        from { transform: translateY(0); }
        to { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>

    <!-- ローディング画面 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-box">
        <div class="loading-icon">🪄</div>
        <div class="loading-text" id="loadingText">うらない中...</div>
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="app-container">
      <div class="header">
        <p class="title">✨ 魔法のてんこアプリ 🌸</p>
        <div class="clock" id="clock">00:00:00</div>
      </div>

      <div class="card" id="mainCard">
        <form id="tenkoForm">
          <div class="form-group">
            <label for="staffName">♡ メンバーをえらんでね ♡</label>
            <div class="select-wrapper">
              <select id="staffName" onchange="checkWorkingStatus()" required>
                <option value="">お名前を選択してください</option>
              </select>
            </div>
          </div>

          <div class="btn-group">
            <button type="button" class="btn btn-in" id="btnIn" onclick="submitTenko('出勤')">
              <span>💖 しゅっきんする！</span>
            </button>
            <button type="button" class="btn btn-out" id="btnOut" onclick="submitTenko('退勤')">
              <span>🌙 たいきんする！</span>
            </button>
          </div>
        </form>

        <div id="result"></div>
      </div>
    </div>

    <script>
      var STAFF_LIST = [
        "池田晴樹",
        "今井真仁",
        "稲葉優冴",
        "大箱竜太郎",
        "川口恭平",
        "木脇勇太郎",
        "倉田晴也",
        "小早川大和",
        "酒井晴星",
        "下田夏輝",
        "島野聖也",
        "清水慈英",
        "椙山祐太",
        "塚尾優花",
        "土本琉惟",
        "徳應天",
        "中本尋都",
        "仲谷直路",
        "根来宏満",
        "根来桜都",
        "根来汰地",
        "花野瑠香",
        "参河豪太",
        "宮本純平",
        "村田紫逢",
        "森田翔喜",
        "矢野平",
        "山口真怜",
        "山本晴斗",
        "横山彩人",
        "横山聖矢",
        "横山麗矢",
        "吉田來音",
        "吉田学生"

      ];

      // ==========================================
      // GASのWebアプリURL（※ご自身のURLを設定）
      // ==========================================
      var GAS_API_URL = "https://script.google.com/macros/s/AKfycbwwGh6I_VlWHmSng8cRHzLYeuneMG0kwH04bkd3jvrKCTYUPG4ShQufATfOYFxEu9kv/exec";

      var audioCtx = null;
      function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      // ぽよん♪（タップ音）
      function playTapSound() {
        try {
          initAudio();
          var now = audioCtx.currentTime;
          var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } catch(e) {}
      }

      // キラリ〜ン✨（成功音）
      function playSuccessSound() {
        try {
          initAudio();
          var now = audioCtx.currentTime;
          var notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C E G C E
          notes.forEach((freq, idx) => {
            var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.18, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.25);
          });
        } catch(e) {}
      }

      // ぷえ〜ん💧（エラー音）
      function playErrorSound() {
        try {
          initAudio();
          var now = audioCtx.currentTime;
          var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.35);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.35);
        } catch(e) {}
      }

      function triggerHaptic(type) {
        if (navigator.vibrate) {
          if (type === 'error') navigator.vibrate([60, 50, 60]);
          else navigator.vibrate(45);
        }
      }

      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').innerText = `${h}:${m}:${s}`;
      }
      setInterval(updateClock, 1000); updateClock();

      function showLoading(text) {
        document.getElementById('loadingText').innerText = text || 'うらない中...';
        document.getElementById('loadingOverlay').classList.add('active');
      }

      function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
      }

      window.onload = function() {
        var select = document.getElementById('staffName');
        select.innerHTML = '<option value="">お名前を選択してください</option>';
        STAFF_LIST.forEach(function(name) {
          var opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
      };

      function checkWorkingStatus() {
        var staffName = document.getElementById('staffName').value;
        var btnIn = document.getElementById('btnIn');
        var btnOut = document.getElementById('btnOut');

        if (!staffName) {
          btnIn.style.display = 'none';
          btnOut.style.display = 'none';
          return;
        }

        // 名前を選んだ瞬間にローディング表示
        showLoading('確認中だよ... 🎀');

        fetch(GAS_API_URL + "?action=checkStatus&staffName=" + encodeURIComponent(staffName))
          .then(res => res.json())
          .then(res => {
            hideLoading();
            if (res.isWorking) {
              btnIn.style.display = 'none';
              btnOut.style.display = 'flex';
            } else {
              btnIn.style.display = 'flex';
              btnOut.style.display = 'none';
            }
          })
          .catch(err => {
            hideLoading();
            btnIn.style.display = 'flex';
            btnOut.style.display = 'flex';
          });
      }

      function submitTenko(status) {
        playTapSound();
        triggerHaptic('tap');

        var staffName = document.getElementById('staffName').value;
        if (!staffName) {
          showErrorAlert('お名前を選択してください');
          return;
        }

        var btnIn = document.getElementById('btnIn');
        var btnOut = document.getElementById('btnOut');
        btnIn.disabled = true;
        btnOut.disabled = true;

        showLoading(status + '処理中だよ... ✨');

        sendData(staffName, status, btnIn, btnOut);
      }

      function showErrorAlert(msg) {
        hideLoading();
        playErrorSound();
        triggerHaptic('error');
        
        var card = document.getElementById('mainCard');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');

        var resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        resDiv.className = 'result-error';
        resDiv.innerHTML = '<div class="result-title"><span>😢</span> <span>あれれ？エラーだよ</span></div><div style="margin-top:4px; text-align:center;">' + msg + '</div>';
      }

      function sendData(staffName, status, btnIn, btnOut) {
        var data = {
          staffName: staffName,
          status: status
        };

        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(res => {
          hideLoading();
          btnIn.disabled = false;
          btnOut.disabled = false;
          
          var resDiv = document.getElementById('result');

          if (res.success) {
            playSuccessSound();
            triggerHaptic('success');

            resDiv.style.display = 'block';
            resDiv.className = 'result-success';

            var html = '<div class="result-title"><span>✨</span> <span>' + res.message + '</span></div>';
            if (res.workHours) {
              html += '<div class="info-row"><span>がんばった時間</span><span class="info-val">' + res.workHours + ' h</span></div>';
              html += '<div class="info-row"><span>きょうのごほうび</span><span class="info-val">¥' + res.pay + '</span></div>';
            }
            resDiv.innerHTML = html;

            checkWorkingStatus();
          } else {
            showErrorAlert(res.message);
          }
        })
        .catch(err => {
          hideLoading();
          btnIn.disabled = false;
          btnOut.disabled = false;
          showErrorAlert('通信エラーが発生しちゃった');
        });
      }
    </script>
  </body>
</html>
